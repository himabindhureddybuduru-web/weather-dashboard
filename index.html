<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>🌦 Weather Dashboard</h1>

        <!-- Search Section -->
        <div class="search-box">

            <input
                type="text"
                id="cityInput"
                placeholder="Enter city name">

            <button id="searchBtn">
                Search
            </button>
            <button id="locationBtn">
    📍 Use My Location
</button>

        </div>

        <!-- Loading -->
        <p id="loading" class="hidden">
            Loading...
        </p>

        <!-- Error Message -->
        <p id="error" class="hidden"></p>

        <!-- Weather Card -->
        <div id="weatherCard" class="weather-card hidden">

            <h2 id="cityName"></h2>

            <img
                id="weatherIcon"
                src=""
                alt="Weather Icon">

            <h3 id="temperature"></h3>

            <p id="description"></p>

            <div class="details">

                <div class="detail-box">
                    <h4>Humidity</h4>
                    <p id="humidity"></p>
                </div>

                <div class="detail-box">
                    <h4>Wind Speed</h4>
                    <p id="wind"></p>
                </div>

                <div class="detail-box">
                    <h4>Feels Like</h4>
                    <p id="feelsLike"></p>
                </div>

                <div class="detail-box">
                    <h4>Country</h4>
                    <p id="country"></p>
                </div>

            </div>

        </div>
        <!-- 5-Day Forecast -->
<div id="forecastSection" class="hidden">

    <h2>5-Day Forecast</h2>

    <div id="forecastCards" class="forecast-container"></div>

</div>

    </div>

    <script src="script.js"></script>

</body>
</html>
